<title>툴콜 라벨 검수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first. Sticky lab bar, one swipe card centered with its three answer buttons under the thumb; wider screens only widen margins. */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --sunk:#e8ecf1; --line:#d3d9e1; --fg:#151c26; --muted:#5b6676;
  --ink:#2448c9; --ink-soft:#e2e8fb; --ink-fg:#ffffff;
  --ok:#14804a; --ok-soft:#d9f1e3; --bad:#c42a3d; --bad-soft:#fbe0e3; --hold:#7a3fe0; --hold-soft:#ebe3fc; --warn:#a85b06; --warn-soft:#faebd4;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --panel:#161d27; --sunk:#1e2733; --line:#2b3645; --fg:#e3e8ef; --muted:#94a0b1;
  --ink:#86a6ff; --ink-soft:#1e2b4c; --ink-fg:#0e131a;
  --ok:#4bc382; --ok-soft:#163626; --bad:#ff7d8c; --bad-soft:#40181e; --hold:#b598ff; --hold-soft:#2b2346; --warn:#f0a54a; --warn-soft:#3a2913;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161d27; --sunk:#1e2733; --line:#2b3645; --fg:#e3e8ef; --muted:#94a0b1;
  --ink:#86a6ff; --ink-soft:#1e2b4c; --ink-fg:#0e131a;
  --ok:#4bc382; --ok-soft:#163626; --bad:#ff7d8c; --bad-soft:#40181e; --hold:#b598ff; --hold-soft:#2b2346; --warn:#f0a54a; --warn-soft:#3a2913;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1100px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .top{display:flex;align-items:center;gap:10px;padding-block:9px 6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .prj{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.brand b{font-size:15px;white-space:nowrap}
.spacer{flex:1}
.whobtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;max-width:46vw}
.whobtn .L{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font-family:var(--mono);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
.whobtn span:last-child{overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.live{background:var(--ok)} .sync.warn{background:var(--warn)} .sync.off{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:5px 11px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--sunk);color:var(--fg)}
nav.tabs .cnt{font-family:var(--mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px}
main{padding-block:14px calc(32px + env(safe-area-inset-bottom,0px))}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
/* progress strip */
.strip{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.strip .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip .row1 b{color:var(--fg);font-family:var(--mono);font-size:13px}
.track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.scope{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.scope select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12.5px}
/* deck */
.deck{position:relative;height:max(400px,calc(100dvh - 300px));max-height:640px;margin-bottom:14px;touch-action:pan-y}
.sc{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;will-change:transform;box-shadow:0 1px 3px rgba(10,20,40,.06),0 8px 24px rgba(10,20,40,.06)}
.sc.back{transform:scale(.95) translateY(12px);opacity:.7;pointer-events:none}
.sc.front{cursor:grab;touch-action:pan-y}
.sc.drag{cursor:grabbing;transition:none}
.sc.anim{transition:transform .28s ease,opacity .28s ease}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:700;font-size:22px;letter-spacing:.04em;opacity:0;pointer-events:none;background:var(--panel)}
.stamp.ok{left:18px;color:var(--ok);border-color:var(--ok);transform:rotate(-8deg)}
.stamp.bad{right:18px;color:var(--bad);border-color:var(--bad);transform:rotate(8deg)}
.stamp.hold{left:50%;top:auto;bottom:90px;color:var(--hold);border-color:var(--hold);transform:translateX(-50%)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.meta .id{font-family:var(--mono);margin-left:auto}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.p1{background:var(--bad-soft);color:var(--bad)} .pill.p2{background:var(--warn-soft);color:var(--warn)} .pill.p3{background:var(--hold-soft);color:var(--hold)} .pill.p4{background:var(--sunk);color:var(--muted)}
.pill.iss{border-color:var(--line);color:var(--fg)}
.sect{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.task{display:flex;flex-direction:column;gap:8px}
.ctx{background:var(--sunk);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--muted);align-self:flex-start;max-width:100%}
.ctx b{font-weight:600;color:var(--fg);margin-right:4px}
.req{font-size:clamp(19px,5.4vw,24px);font-weight:600;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere}
.call{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.callmain{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.callmain .arrow{font-family:var(--mono);color:var(--muted)}
.tool{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tool.main{font-size:18px;font-weight:600;background:var(--ink-soft);color:var(--ink);padding:4px 12px;border-radius:8px}
.easy{font-size:13px;color:var(--fg);background:var(--sunk);border-radius:8px;padding:6px 10px}
.ex{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--fg)}
.ex li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ex li::before{font-family:var(--mono);font-weight:600;flex:none}
.ex li.y::before{content:"✓";color:var(--ok)}
.ex li.n::before{content:"✗";color:var(--bad)}
.ex li.n{color:var(--muted)}
.ex .tool{font-size:11.5px;padding:0 6px}
.easy details.exd{margin-top:4px}
.easy b.mono{margin-right:2px}
.tool.ko{font-family:var(--font);font-size:12.5px;color:var(--muted);background:transparent;padding:0}
.callrows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px;align-items:center}
.callrows dt{color:var(--muted);font-size:12px;white-space:nowrap}
.callrows dd{margin:0;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0}
.yes{color:var(--bad);font-weight:600} .no{color:var(--muted)}
details.why{font-size:12.5px;color:var(--muted);margin-top:auto}
details.why summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-family:var(--mono)}
details.why[open] summary::before{content:"−"}
details.why p{margin:6px 0 0}
.conf{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.conf i{display:inline-block;width:56px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;position:relative}
.conf i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c)}
.answers{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.ans{border:1.5px solid;border-radius:14px;padding:12px 10px;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel)}
.ans small{font-weight:400;font-size:11.5px;opacity:.8}
.ans.ok{color:var(--ok);border-color:var(--ok)} .ans.ok:active{background:var(--ok-soft)}
.ans.bad{color:var(--bad);border-color:var(--bad)} .ans.bad:active{background:var(--bad-soft)}
.ans.hold{color:var(--hold);border-color:var(--line);font-size:13px;padding-inline:14px}
.ans[disabled]{opacity:.4}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink);padding:4px 0;font-size:12.5px}
.linkbtn[disabled]{color:var(--muted);opacity:.5}
.keys-hint{display:none}
@media (hover:hover) and (pointer:fine){.keys-hint{display:inline}}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.done{height:auto;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:30px}
.done b{color:var(--fg);font-size:18px}
/* pick panel (fix + gold) */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.grid10{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:620px){.grid10{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cls{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 9px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:0;position:relative}
.cls .n{font-family:var(--mono);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:14px}
.cls .d{font-size:11.5px;color:var(--muted)}
.cls .k{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cls.sel{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)} .cls.sel .d,.cls.sel .k{color:var(--ink-fg);opacity:.85}
.cls.was{border-style:dashed}
.cls.was .d::after{content:" · 원래 라벨";}
.cls.also{box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.memo{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px}
.memo:focus{border-color:var(--ink);outline:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.hold{color:var(--hold)}
.btn.sm{padding:5px 11px;font-size:12.5px;font-weight:500;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lbl{font-size:12px;color:var(--muted);font-weight:500}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.li .s{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vchip{font-size:11.5px;font-weight:600;border-radius:5px;padding:0 7px}
.v-ok{background:var(--ok-soft);color:var(--ok)} .v-bad{background:var(--bad-soft);color:var(--bad)} .v-hold{background:var(--hold-soft);color:var(--hold)} .v-fixed{background:var(--ink-soft);color:var(--ink)}
.h2{font-size:16px;font-weight:700;margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:65ch}
/* setup */
.setup{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.setup h1{font-size:22px;margin:0;text-wrap:balance}
.setup p{margin:0;color:var(--muted);max-width:62ch}
.slots{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.slot .hd{display:flex;align-items:center;gap:10px}
.slot .L{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.slot .s{font-size:12.5px;color:var(--muted)}
.slot input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;width:100%}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.how b{font-size:14px}
.how .l b{color:var(--ok)} .how .r b{color:var(--bad)} .how .u b{color:var(--hold)}
/* stats */
.sgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.rv .L{font-family:var(--mono);font-weight:600;color:var(--ink)}
.rv .num{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--mono)}
.sub{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tw{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.note{font-size:12.5px;color:var(--muted);max-width:70ch;margin:0}
/* guide */
ol.rules{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;max-width:70ch}
ol.rules li::marker{font-family:var(--mono);color:var(--muted)}
.issue{border-left:3px solid var(--hold);padding:2px 0 2px 12px;font-size:13px}
.issue b{display:block}
.toolt{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.toolt div{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:13px}
.toolt div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){.sc.anim{transition:opacity .15s}}
</style>

<script type="application/json" id="DATA">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("DATA").textContent);
const C = D.classes;
const KO = Object.fromEntries(D.tools.map(t => [t[0], t[1]]));
const SLOTS = ["A","B","C"];
// 쉬운 설명은 데이터(tools[i][5])에서 온다. 도구 세트가 바뀌어도 코드는 그대로.
const EASY = Object.fromEntries(D.tools.map(t => [t[0], t[5] || t[2]]));
const EX = Object.fromEntries(D.tools.map(t => [t[0], {yes: t[6] || [], no: t[7] || []}]));
function exList(tool){
  const e = EX[tool]; if (!e || (!e.yes.length && !e.no.length)) return null;
  return h("ul",{class:"ex"},
    e.yes.map(r => h("li",{class:"y"},r)),
    e.no.map(([r,c]) => h("li",{class:"n"},r, h("span",{class:"tool"},"→ " + c))));
}
function exBlock(tool, open){
  const l = exList(tool); if (!l) return null;
  return h("details",{class:"why exd",open:open || null},h("summary",null,"예시"),l);
}
const PRI = {1:"1순위 · 확신 낮음",2:"2순위 · 생성 의도와 다름",3:"3순위 · 부분 일치",4:"4순위 · 일치"};
const ISSUE = {}; // 미결 쟁점 3개는 Dev·Ops 문장 제외로 해당 없음 (2026-11-14)
const RULES = D.rules;
// item tuple: [id, split, lang, context, request, first, also_ok[], sequence[], needs_confirm, rule, confidence, note, priority, why, issues[], assignee]

function h(tag, attrs, ...kids){

    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}

async function boot(){
  setSync("wait", "저장소 연결 중");
  let first = false;
  const timer = setTimeout(() => { if (!first) { setSync("warn", "저장소 응답이 늦어요. 결과가 최신이 아닐 수 있어요."); render(); } }, 10000);
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
    S.db = db; S.user = user;
    if (user){ try { S.uid = await user.id(); } catch {} try { S.isOwner = !!user.isOwner(); } catch {} try { S.isAdmin = !!user.canEdit(); } catch {} try { S.canWrite = await user.can("data.write"); } catch { S.canWrite = null; } }
    if (!db){ clearTimeout(timer); setSync("off", "저장소에 연결할 수 없어요"); render(); return; }
    let pending = 7;
    const ok = () => { if (--pending <= 0 && !first){ first = true; clearTimeout(timer); setSync("live", "실시간 저장 중"); } };
    const err = e => { clearTimeout(timer); setSync("off", "저장소 오류: " + (e && e.code || "unknown")); render(); };

      let a = false, b = false;
      db.collection("rv_"+s).onSnapshot(snap => { const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data()); S.rv[s] = m; if (!a && !snap.metadata.fromCache){ a = true; ok(); } render(); }, err);
      db.collection("gold_"+s).onSnapshot(snap => { const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data()); S.gd[s] = m; if (!b && !snap.metadata.fromCache){ b = true; ok(); } render(); }, err);
    }
    if (S.isAdmin || S.isOwner){
      // 심어둔 오답의 정답표. 규칙상 편집자·소유자만 읽을 수 있어요.
      db.doc("data/answerkey/items/planted").onSnapshot(snap => { S.key = snap.exists ? (snap.data().ids || {}) : {}; render(); }, () => {});
    }
    let c = false;
    db.doc("config/reviewers").onSnapshot(snap => { const d = snap.exists ? snap.data() : {}; S.names = {A:d.A||"",B:d.B||"",C:d.C||""}; S.sids = {A:d.A_sid||"",B:d.B_sid||"",C:d.C_sid||""}; if (!c && !snap.metadata.fromCache){ c = true; ok(); } render(); }, err);
  } catch(e){ clearTimeout(timer); setSync("off", "저장소에 연결할 수 없어요"); render(); }
}
async function write(coll, id, data){
  const map = coll.startsWith("rv_") ? S.rv[coll.slice(3)] : S.gd[coll.slice(5)];
  const prev = map.get(id);
  map.set(id, data); // optimistic
  if (!S.db){ toast("저장소에 연결되지 않아 이 기기에서만 보여요"); return true; }
  try { await S.db.collection(coll).doc(id).set(data); return true; }
  catch(e){
    if (prev) map.set(id, prev); else map.delete(id);
    if (e && e.code === "invalid_argument") { S.canWrite = false; toast("저장 권한이 없어요. 기여자(Contributor) 이상 권한이 필요해요."); }
    else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. Daniel에게 알려 주세요.");
    else toast("저장하지 못했어요. 잠시 뒤 다시 해 주세요.");
    render(); return false;
  }
}
async function remove(coll, id){
  const map = coll.startsWith("rv_") ? S.rv[coll.slice(3)] : S.gd[coll.slice(5)];
  map.delete(id);
  if (S.db) { try { await S.db.collection(coll).doc(id).delete(); } catch { toast("되돌리지 못했어요"); } }
}

const reviewedByAny = id => SLOTS.some(s => S.rv[s].has(id));
function myQueue(){

function counts(s){

  for (const x of ITEMS) if (x.who === s || x.who === "*") c.assigned++;
  for (const d of S.rv[s].values()){ c[d.v] = (c[d.v]||0)+1; if (d.v === "bad" && d.first != null) c.fixed++; }
  return c;
}

function attachSwipe(el, x){
  let sx = 0, sy = 0, dx = 0, dy = 0, t0 = 0, on = false, id = null;
  const okS = el.querySelector(".stamp.ok"), badS = el.querySelector(".stamp.bad");
  el.addEventListener("pointerdown", e => {
    if (e.target.closest("summary,details p")) return;
    if (S.canWrite === false) return;
    on = true; id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = performance.now();
    el.classList.add("drag"); el.classList.remove("anim");
  });
  el.addEventListener("pointermove", e => {
    if (!on || e.pointerId !== id) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { try { el.setPointerCapture(id); } catch {} }
    el.style.transform = `translate(${dx}px, ${dy*0.15}px) rotate(${dx/18}deg)`;
    // left = 맞음, right = 틀림
    okS.style.opacity = Math.min(1, Math.max(0, -dx/110));
    badS.style.opacity = Math.min(1, Math.max(0, dx/110));
  });
  const end = e => {
    if (!on || (e && e.pointerId !== id)) return;
    on = false; el.classList.remove("drag");
    const w = el.offsetWidth, v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if (Math.abs(dx) > Math.min(120, w * .28) || (v > .6 && Math.abs(dx) > 40)) fling(el, x, dx < 0 ? "ok" : "bad");
    else { el.classList.add("anim"); el.style.transform = ""; okS.style.opacity = 0; badS.style.opacity = 0; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
let flinging = false;
function fling(el, x, v){
  if (flinging || S.canWrite === false) return;
  flinging = true;
  const w = window.innerWidth;
  el.classList.remove("drag"); el.classList.add("anim");
  const st = el.querySelector(".stamp." + v); if (st) st.style.opacity = 1;
  el.style.transform = v === "ok" ? `translate(${-w*1.2}px, 30px) rotate(-18deg)` : v === "bad" ? `translate(${w*1.2}px, 30px) rotate(18deg)` : `translateY(-120%) scale(.9)`;
  el.style.opacity = "0";
  const ms = Date.now() - S.shownAt;
  setTimeout(async () => {
    flinging = false;
    const data = {v, uid: S.uid || null, at: Date.now(), ms: Math.min(ms, 600000)};
    S.undo.push({coll: "rv_"+S.slot, id: x.id}); if (S.undo.length > 30) S.undo.shift();
    await write("rv_"+S.slot, x.id, data);
    render();
  }, 240);
  render.bind(null);
}

}
function exportGoldLabels(){

  for (const x of ITEMS){

    if (!d) continue;
    let L = null;
    if (d.v === "ok" && !(K[x.id] && K[x.id].p)) L = lbl(x.first, x.also, x.nc);
    else if (d.v === "bad" && d.first != null) L = lbl(d.first, d.also, d.nc);

  }
  save("gold-labels-v1.jsonl", out.join("\n") + "\n");
}
function exportGold(){
  const out = GOLD.map(g => {
    const per = {}; const votes = {};
    for (const s of SLOTS){ const d = S.gd[s].get(g.id); per[s] = d ? {...(d.first != null ? lbl(d.first, d.also, d.nc) : {first:null}), hold:!!d.hold, memo:d.memo||""} : null; if (d && d.first != null) votes[d.first] = (votes[d.first]||0) + 1; }
    const top = Object.entries(votes).sort((a,b) => b[1]-a[1])[0];
    return JSON.stringify({id:g.id, labels:per, majority: top && top[1] >= 2 ? C[top[0]] : null});
  });
  save("testset-human-v1.jsonl", out.join("\n") + "\n");
}
function exportHolds(){

}

/* ---------- keys ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.tab === "swipe" && S.slot){
    const front = document.querySelector(".sc.front"); const q = myQueue();
    if (!front || !q[0]) { if (e.key === "z" || e.key === "Z") undo(); return; }
    if (e.key === "ArrowLeft"){ e.preventDefault(); fling(front, q[0], "ok"); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); fling(front, q[0], "bad"); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); fling(front, q[0], "hold"); }
    else if (e.key === "z" || e.key === "Z") undo();
  } else if ((S.tab === "gold" || (S.tab === "fix" && S.fixId)) && S.draft && /^[0-9]$/.test(e.key)){
    const i = (Number(e.key) + 9) % 10; S.draft.first = S.draft.first === i ? null : i; S.draft.also = S.draft.also.filter(a => a !== i); render();
  }
});

if (!["swipe","fix","gold","stats","guide"].includes(S.tab)) S.tab = "swipe";
render();
boot();
